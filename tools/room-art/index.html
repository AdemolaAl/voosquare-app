<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Room art</title>
<style>body{margin:0;background:#1b1b1b;font:13px system-ui;color:#ccc}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:12px;padding:12px}.g img{width:100%;display:block;border-radius:14px}.w{grid-column:span 3}</style>
</head><body><div class="g" id="g"></div>
<script src="../../public/js/shared.js"></script>
<script src="art.js"></script>
<script>
/* Draw one plate to a canvas and encode it. Chromium encodes WebP natively. */
window.renderArt = async function (slug, kind, quality) {
  const room = ROOM_ART.ROOMS.find((r) => r.slug === slug);
  const [W, H] = kind === 'cover' ? [1200, 400] : [512, 512];
  const svg = ROOM_ART.plate(room, W, H);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(img, 0, 0, W, H);
  return c.toDataURL('image/webp', quality || 0.86);
};
/* Contact sheet (open this file in a browser to look at every plate). */
window.sheet = async function () {
  const g = document.getElementById('g');
  for (const r of ROOM_ART.ROOMS) {
    const a = document.createElement('img'); a.src = await renderArt(r.slug, 'square'); g.appendChild(a);
    const b = document.createElement('img'); b.className = 'w'; b.src = await renderArt(r.slug, 'cover'); g.appendChild(b);
  }
};
if (!navigator.webdriver) sheet();
</script></body></html>
